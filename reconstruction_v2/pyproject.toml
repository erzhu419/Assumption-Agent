[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assumption-agent-reconstruction-v2"
version = "0.1.0"
description = "A controlled self-evolution kernel for executable, recursively verified hypotheses."
requires-python = ">=3.10"

[project.optional-dependencies]
skilllearn = [
  "json-repair>=0.61,<1",
  "tomli>=2.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
