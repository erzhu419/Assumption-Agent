[package]
name = "hegel-q1-archive-projection-oracle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent Rust target-blind node-three Q1 archive semantic oracle"

[lib]
name = "hegel_q1_archive_projection_oracle"
path = "src/lib.rs"

[[bin]]
name = "hegel-q1-archive-projection-oracle"
path = "src/main.rs"

[dependencies]
hegel-strict-canonicalizer = { path = "../strict_canonicalizer" }
hegel-strict-canonicalizer-shrink6 = { path = "../strict_canonicalizer_shrink6" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
