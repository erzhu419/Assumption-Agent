[package]
name = "hegel-strict-canonicalizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent Rust replay for the Hegel Machine v1.0.2 strict AST/CBOR gate"

[lib]
name = "hegel_strict_canonicalizer"
path = "src/lib.rs"

[[bin]]
name = "hegel-strict-canonicalizer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
