[package]
name = "hegel-strict-canonicalizer-shrink1"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent Rust shrink-1 admission and 25,872 subset replay"

[lib]
name = "hegel_strict_canonicalizer_shrink1"
path = "src/lib.rs"

[[bin]]
name = "hegel-strict-canonicalizer-shrink1"
path = "src/main.rs"

[dependencies]
hegel-strict-canonicalizer = { path = "../strict_canonicalizer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
