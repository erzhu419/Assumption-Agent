[package]
name = "hegel-m3-closure-enumerator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent Rust bounded complete-closure enumerator for Hegel Machine M3"

[lib]
name = "hegel_m3_closure_enumerator"
path = "src/lib.rs"

[[bin]]
name = "hegel-m3-closure-enumerator"
path = "src/main.rs"

[dependencies]
hegel-strict-canonicalizer = { path = "../strict_canonicalizer" }
hegel-strict-canonicalizer-shrink1 = { path = "../strict_canonicalizer_shrink1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
