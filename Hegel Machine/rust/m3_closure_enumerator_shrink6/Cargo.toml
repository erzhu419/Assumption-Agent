[package]
name = "hegel-m3-closure-enumerator-shrink6"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent Rust complete-closure diagnostic for Hegel Machine shrink step 6"

[lib]
name = "hegel_m3_closure_enumerator_shrink6"
path = "src/lib.rs"

[[bin]]
name = "hegel-m3-closure-enumerator-shrink6"
path = "src/main.rs"

[dependencies]
hegel-strict-canonicalizer = { path = "../strict_canonicalizer" }
hegel-strict-canonicalizer-shrink6 = { path = "../strict_canonicalizer_shrink6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
