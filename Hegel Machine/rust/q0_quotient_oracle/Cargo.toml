[package]
name = "hegel-q0-quotient-oracle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent Rust exhaustive micro oracle for Hegel Phase-3A-Q0"

[lib]
name = "hegel_q0_quotient_oracle"
path = "src/lib.rs"

[[bin]]
name = "hegel-q0-quotient-oracle"
path = "src/main.rs"

[dependencies]
hegel-strict-canonicalizer = { path = "../strict_canonicalizer" }
hegel-strict-canonicalizer-shrink6 = { path = "../strict_canonicalizer_shrink6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
