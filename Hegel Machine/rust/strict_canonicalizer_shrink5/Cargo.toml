[package]
name = "hegel-strict-canonicalizer-shrink5"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Independent Rust strict admission for Hegel old DSL shrink step 5"

[lib]
name = "hegel_strict_canonicalizer_shrink5"
path = "src/lib.rs"

[[bin]]
name = "hegel-strict-canonicalizer-shrink5"
path = "src/main.rs"

[dependencies]
hegel-strict-canonicalizer = { path = "../strict_canonicalizer" }
hegel-strict-canonicalizer-shrink2 = { path = "../strict_canonicalizer_shrink2" }
hegel-strict-canonicalizer-shrink3 = { path = "../strict_canonicalizer_shrink3" }
hegel-strict-canonicalizer-shrink4 = { path = "../strict_canonicalizer_shrink4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
