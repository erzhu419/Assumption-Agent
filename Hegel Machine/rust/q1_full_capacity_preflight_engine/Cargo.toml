[package]
name = "hegel-q1-full-capacity-preflight-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Target-blind full depth-three/node-six Q1 capacity diagnostic engine"

[lib]
name = "hegel_q1_full_capacity_preflight_engine"
path = "src/lib.rs"

[[bin]]
name = "hegel-q1-full-capacity-preflight-engine"
path = "src/main.rs"

[[bin]]
name = "hegel-q1-formal-archive-materializer"
path = "src/formal_materializer_main.rs"

[dependencies]
hegel-strict-canonicalizer = { path = "../strict_canonicalizer" }
hegel-strict-canonicalizer-shrink6 = { path = "../strict_canonicalizer_shrink6" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
hegel-q1-archive-projection-oracle = { path = "../q1_archive_projection_oracle" }
