[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hegel-machine"
version = "0.85.0"
description = "Executable hypothesis discovery, active experimentation, and revisable cross-task knowledge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research prototype; see repository licensing and archived upstream licenses." }
authors = [{ name = "Assumption Agent project" }]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hegel-machine = "hegel_machine.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
